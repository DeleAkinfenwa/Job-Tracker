name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: job_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/job_tracker
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_DEBUG: "False"
      DJANGO_SECURE_SSL_REDIRECT: "False"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Django system checks (including deployment settings)
        run: |
          python manage.py check
          python manage.py check --deploy --fail-level ERROR

      - name: Migrations are in sync with the models
        run: python manage.py makemigrations --check --dry-run

      - name: OpenAPI schema is valid
        run: python manage.py spectacular --validate --fail-on-warn --file /dev/null

      - name: Run tests against Postgres
        run: python manage.py test --verbosity 2
