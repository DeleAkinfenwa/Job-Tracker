# Render Blueprint: deploys the API from the Dockerfile.
# Set DATABASE_URL in the Render dashboard to a free Postgres from Neon or Supabase.
services:
  - type: web
    name: job-tracker-django
    runtime: docker
    plan: free
    healthCheckPath: /health/
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      # The deployed frontend's URL, e.g. https://job-tracker.netlify.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Resume agent: set both in the dashboard. Leave AGENT_OWNER_EMAILS empty to turn the agent off.
      - key: AGENT_OWNER_EMAILS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
